services:
  localstack:
    image: localstack/localstack:2026.10.0@sha256:aa5632e041ca54ff61a0a25e17b1c898b09a1eb7f611bfc05f73ef53b7266872
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LocalStack token required}
      LOCALSTACK_HOST: localstack:4566
      LAMBDA_DOCKER_NETWORK: ${CONTENT_OPS_PROJECT:?Project required}-lab
      LAMBDA_DOCKER_FLAGS: --label jawstack.owner=${CONTENT_OPS_OWNER_ID:?Owner required} --label jawstack.lab=${CONTENT_OPS_PROJECT:?Project required} --label jawstack.runtime=lambda
      SQS_ENDPOINT_STRATEGY: "off"
      LS_LOG: warn
      PERSISTENCE: "0"
    labels:
      jawstack.owner: ${CONTENT_OPS_OWNER_ID:?Owner required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lab
networks:
  lab:
    name: ${CONTENT_OPS_PROJECT:?Project required}-lab
